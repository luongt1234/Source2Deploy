services:
  # ==========================================
  # Core Infrastructure Services
  # ==========================================

  postgres:
    image: postgres:16-alpine
    container_name: s2d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - s2d_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - s2d-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: s2d-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - s2d-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: s2d-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - s2d-network

  redis:
    image: redis:7-alpine
    container_name: s2d-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - s2d-network

  # ==========================================
  # Business Microservices
  # ==========================================

  auth-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USERNAME:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth-local-only}
    volumes:
      - s2d_auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - s2d-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTH_PORT:-8089}:8089"
    environment:
      SERVER_PORT: 8089
      SPRING_PROFILES_ACTIVE: dev
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/auth_db
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth-local-only}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_SIGNING_KEY: /var/lib/source2deploy-auth/dev-signing.key
      AUTH_CORS_ORIGINS: ${AUTH_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AUTH_DEV_CLIENT_ID: ${AUTH_DEV_CLIENT_ID:-source2deploy-web}
      AUTH_DEV_REDIRECT_URIS: ${AUTH_DEV_REDIRECT_URIS:-http://localhost:5173/callback}
      AUTH_DEV_POST_LOGOUT_URIS: ${AUTH_DEV_POST_LOGOUT_URIS:-http://localhost:5173/}
      AUTH_DEV_CLIENT_CONSENT: ${AUTH_DEV_CLIENT_CONSENT:-false}
      AUTH_ACCESS_LIFETIME: ${AUTH_ACCESS_LIFETIME:-5m}
      AUTH_REFRESH_LIFETIME: ${AUTH_REFRESH_LIFETIME:-8h}
      AUTH_CODE_LIFETIME: ${AUTH_CODE_LIFETIME:-2m}
      AUTH_RECOVERY_ENABLED: ${AUTH_RECOVERY_ENABLED:-false}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-true}
    volumes:
      - s2d_auth_signing:/var/lib/source2deploy-auth
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - s2d-network

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: s2d-gateway-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_JWKS_URI: http://auth-service:8089/oauth2/jwks
      AUTH_SERVICE_URL: http://auth-service:8089
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      PROJECT_SERVICE_URL: http://project-service:8081
      DEPLOYMENT_SERVICE_URL: http://deployment-service:8082
      ANALYZER_SERVICE_URL: http://analyzer-service:8083
      BUILD_SERVICE_URL: http://build-service:8084
      BUILD_SERVICE_WS_URL: ws://build-service:8084
      REGISTRY_SERVICE_URL: http://registry-service:8085
      INFRASTRUCTURE_SERVICE_URL: http://infrastructure-service:8086
      DEPLOY_SERVICE_URL: http://deploy-service:8087
      MONITORING_SERVICE_URL: http://monitoring-service:8088
      MONITORING_SERVICE_WS_URL: ws://monitoring-service:8088
    depends_on:
      - project-service
      - deployment-service
      - auth-service
    networks:
      - s2d-network

  project-service:
    build:
      context: .
      dockerfile: project-service/Dockerfile
    container_name: s2d-project-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_JWKS_URI: http://auth-service:8089/oauth2/jwks
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - s2d-network

  deployment-service:
    build:
      context: .
      dockerfile: deployment-service/Dockerfile
    container_name: s2d-deployment-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_JWKS_URI: http://auth-service:8089/oauth2/jwks
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deployment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - s2d-network

  analyzer-service:
    build:
      context: .
      dockerfile: analyzer-service/Dockerfile
    container_name: s2d-analyzer-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_JWKS_URI: http://auth-service:8089/oauth2/jwks
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analyzer_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - s2d-network

  build-service:
    build:
      context: .
      dockerfile: build-service/Dockerfile
    container_name: s2d-build-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_JWKS_URI: http://auth-service:8089/oauth2/jwks
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/build_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - s2d-network

  registry-service:
    build:
      context: .
      dockerfile: registry-service/Dockerfile
    container_name: s2d-registry-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_JWKS_URI: http://auth-service:8089/oauth2/jwks
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/registry_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - s2d-network

  infrastructure-service:
    build:
      context: .
      dockerfile: infrastructure-service/Dockerfile
    container_name: s2d-infrastructure-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_JWKS_URI: http://auth-service:8089/oauth2/jwks
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/infrastructure_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - s2d-network

  deploy-service:
    build:
      context: .
      dockerfile: deploy-service/Dockerfile
    container_name: s2d-deploy-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_JWKS_URI: http://auth-service:8089/oauth2/jwks
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deploy_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - s2d-network

  monitoring-service:
    build:
      context: .
      dockerfile: monitoring-service/Dockerfile
    container_name: s2d-monitoring-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8089}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-source2deploy-api}
      AUTH_JWKS_URI: http://auth-service:8089/oauth2/jwks
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitoring_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - s2d-network

volumes:
  s2d_auth_postgres_data:
  s2d_auth_signing:
  s2d_postgres_data:
    driver: local

networks:
  s2d-network:
    driver: bridge
