server:
  port: ${SERVER_PORT:8089}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: S2DSESSION
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

auth:
  issuer: ${AUTH_ISSUER}
  audience: ${AUTH_AUDIENCE:source2deploy-api}
  signing-key: ${AUTH_SIGNING_KEY}
  previous-keys: ${AUTH_PREVIOUS_KEYS:}
  cors-origins: ${AUTH_CORS_ORIGINS:}
  access-lifetime: ${AUTH_ACCESS_LIFETIME:5m}
  refresh-lifetime: ${AUTH_REFRESH_LIFETIME:8h}
  code-lifetime: ${AUTH_CODE_LIFETIME:2m}
  recovery:
    enabled: ${AUTH_RECOVERY_ENABLED:false}
    from: ${AUTH_MAIL_FROM:}

