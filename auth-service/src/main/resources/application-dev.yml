server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}

auth:
  issuer: ${AUTH_ISSUER:http://localhost:8089}
  signing-key: ${AUTH_SIGNING_KEY:auth-secrets/dev-signing.key}
  cors-origins: ${AUTH_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  clients:
    - id: ${AUTH_DEV_CLIENT_ID:source2deploy-web}
      redirect-uris: ${AUTH_DEV_REDIRECT_URIS:http://localhost:5173/callback}
      post-logout-redirect-uris: ${AUTH_DEV_POST_LOGOUT_URIS:http://localhost:5173/}
      consent: ${AUTH_DEV_CLIENT_CONSENT:false}
      scopes: openid,profile,email,identity:read,project:read,project:create,source:read,deployment:create,deployment:read,deployment:cancel
