server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false # Use explicit routing definitions below
          lower-case-service-id: true
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
            methods: GET
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:5173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            exposed-headers:
              - "X-Correlation-ID"
              - "Authorization"
            allow-credentials: true
            max-age: 3600

      routes:
        # 1. Project Service
        - id: project-service
          uri: ${PROJECT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/projects/**
          filters:
            - StripPrefix=0

        # 2. Deployment Service
        - id: deployment-service
          uri: ${DEPLOYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/deployments/**
          filters:
            - StripPrefix=0

        # 3. Analyzer Service
        - id: analyzer-service
          uri: ${ANALYZER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/analyzer/**
          filters:
            - StripPrefix=0

        # 4. Build Service
        - id: build-service
          uri: ${BUILD_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/builds/**
          filters:
            - StripPrefix=0

        # 5. Build Service - WebSocket (Build Logs Streaming)
        - id: build-service-ws
          uri: ${BUILD_SERVICE_WS_URL:ws://localhost:8084}
          predicates:
            - Path=/ws/builds/**

        # 6. Registry Service
        - id: registry-service
          uri: ${REGISTRY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/registry/**
          filters:
            - StripPrefix=0

        # 7. Infrastructure Service
        - id: infrastructure-service
          uri: ${INFRASTRUCTURE_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/infra/**
          filters:
            - StripPrefix=0

        # 8. Deploy Service
        - id: deploy-service
          uri: ${DEPLOY_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/deploy/**
          filters:
            - StripPrefix=0

        # 9. Monitoring Service
        - id: monitoring-service
          uri: ${MONITORING_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/monitoring/**
          filters:
            - StripPrefix=0

        # 10. Monitoring Service - WebSocket (Metrics / Realtime Logs)
        - id: monitoring-service-ws
          uri: ${MONITORING_SERVICE_WS_URL:ws://localhost:8088}
          predicates:
            - Path=/ws/monitoring/**

# Actuator monitoring and health check configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.source2deploy.gateway: DEBUG
    reactor.netty: INFO
